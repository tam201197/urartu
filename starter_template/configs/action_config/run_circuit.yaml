# @package _global_
action_name: run_circuit
debug: false

action_config:
  experiment_name: "discogp with blimp"
  device: "cuda" # auto, cuda, cpu (default)
  seed: 42
  modes: 'we'

  model:
    name: "gpt2" #[gpt2, Qwen/Qwen3-0.6B, Qwen/Qwen3-1.7B, meta-llama/Llama-3.2-1B-Instruct]
    dtype: torch.bfloat16 #["torch.bf16", "torch.fp16", "torch.fp32"]

  dataset:
    task_type: 'glue-qqp' #["pararel", "ioi", "blimp", "glue-sst2", "dbpedia_14", "glue-qqp"]  
    batch_size: 16
    train_split: 0.8
    dev_split: 0.1
    test_split: 0.1

  blimp:
    paradigm: 'anaphor_number_agreement' 
    # [ anaphor_gender_agreement
    #   anaphor_number_agreement
    #   determiner_noun_agreement_1
    #   determiner_noun_agreement_irregular_1
    #   determiner_noun_agreement_with_adjective_1
    #   determiner_noun_agreement_with_adj_irregular_1
    #   regular_plural_subject_verb_agreement_1
    #   irregular_plural_subject_verb_agreement_1
    # ]

  ioi:
    n_ioi_data: 1000

  dbpedia_14:
    n_data: 100
  
  glue-qqp:
    max_train_samples: 20000
    max_val_samples: 2000
    max_test_samples: 2000
    n_per_class: 500

  pararel:
    pararel_rel_ids: P36 # ['P103', 'P127', 'P136', 'P138', 'P140', 'P159', 'P176', 'P19', 'P20', 'P264',
                      #   'P279', 'P30', 'P364', 'P37', 'P407', 'P413', 'P449', 'P495', 'P740', 'P1376', 'P36']
    pararel_data_path: "../actions/disco_gp/data/pararel_data_all.json"
  
  glue-sst2:
    n_per_class: 500

  winogrande:
    task_size: winogrande_s

  optuna:
    use_optuna: False
    number_of_trial: 20
    weight_lr: [0.4, 1]
    weight_lambda_sparse_init: [0, 1]
    weight_lambda_complete_init: [1, 10]
    edge_lr: [0.03, 0.5]
    edge_lambda_sparse_init: [0, 1]
    edge_lambda_complete_init: [5, 20]

  weight_hparams:
    use_weight_masks: True
    gs_temp_weight: 0.01
    logits_w_init: 1.0
    lr: 0.1
    lambda_sparse_init: 1.0 #[0 -> 1]
    lambda_complete_init: 1.0 # [1 -> 10]
    min_times_lambda_sparse: 1.0
    max_times_lambda_sparse: 1000.0

    train_epochs: 300
    n_epoch_warmup_lambda_sparse: 500
    n_epoch_cooldown_lambda_sparse: 1

  edge_hparams:
    use_edge_masks: True
    gs_temp_edge: 1.0
    logits_e_init: 1.0
    lr: 0.1 #0.1
    lambda_sparse_init: 1.0
    lambda_complete_init: 1.0
    min_times_lambda_sparse: 0.01
    max_times_lambda_sparse: 100.0
    train_epochs: 100
    n_epoch_warmup_lambda_sparse: 20
    n_epoch_cooldown_lambda_sparse: 20

  exp_cfg:
    evaluate_every: 1

